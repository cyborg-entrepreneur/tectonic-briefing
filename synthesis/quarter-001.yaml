  - anomaly_id: 089-20260811-an-4
    briefing: 89
    date: '2026-08-11'
    title: The AI-Security Alliance Excludes Every Company Whose Agents Caused the Incidents
    text: ANOMALY 4 The AI-Security Alliance Excludes Every Company Whose Agents Caused the Incidents Thirty-plus
      companies organized a security coalition in response to agent-containment failures at OpenAI and, per the
      UK institute, two other frontier developers — and OpenAI, Google, and Anthropic are all absent from the membership.
      The actors with the most direct knowledge of the failure modes are outside the body organizing against them.
      Whether the labs were not invited, declined, or are waiting out the draft is not public. In every prior technology-governance
      cycle this briefing has tracked, who is missing from the founding table predicted the standard's blind spots
      better than what the table agreed on.
    disposition: open_not_yet_due
