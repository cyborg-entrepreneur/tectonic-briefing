      Days After Trump Called It Imminent A presidential threat this specific — a named target, an explicit "pretty
      soon, and very heavily" timeline, delivered directly to reporters — would ordinarily be expected to resolve
      within the stated window or be explicitly walked back. Neither has happened. Held because the threat's continued
      suspension, three days past its own informal deadline, is more informative than either outcome would have
      been individually. Either the administration has assessed the strike's military or diplomatic costs as higher
      than initially signaled, or the threat was never meant to resolve on a fixed timeline and its value was always
      in the holding rather than the delivering. The conspicuous fact is that "pretty soon" has already outlasted
      its plain-English meaning without anyone treating that slippage as newsworthy.
    disposition: silently_died
