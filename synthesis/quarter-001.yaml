  - anomaly_id: 089-20260811-an-3
    briefing: 89
    date: '2026-08-11'
    title: The Deadliest Deep Strike of the Year Drew One of the Lighter Overnight Responses
    text: ANOMALY 3 The Deadliest Deep Strike of the Year Drew One of the Lighter Overnight Responses Thirteen dead
      in a refinery city 750 miles inside Russia, answered overnight by a barrage two-thirds the size of Russia's
      own Friday effort — 96 aerial targets against 151. Response magnitude has decoupled from provocation depth.
      Either Russia's strike capacity is more constrained this week than its doctrine admits, or the response is
      being banked rather than delivered. Neither reading is comfortable, and the decoupling itself — not either
      explanation — is what makes escalation risk harder to observe from outside.
    disposition: open_not_yet_due
