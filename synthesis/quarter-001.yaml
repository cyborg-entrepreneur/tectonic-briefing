    text: ANOMALY Two Formal International Responses, Zero Deterrent Effect El Obeid's Siege Continued Unchanged
      Through Both a UN Inquiry and an EU Terrorist-Designation Call A UN Human Rights Council urgent inquiry and
      a European Parliament resolution calling for a terrorist designation, landing within three days of each other
      and both explicitly invoking the risk of a second El Fasher-scale atrocity, would ordinarily be expected to
      at minimum coincide with a documented pause or de-escalation in the campaign under scrutiny. No such pause
