research_fit_audit:
- fit: direct
  surface: Task co-evolution / Shifting Sands
  items:
  - Entry-level AI-exposed work declines while occupational aggregates hold (084–087).
  - Humanoid deployment scales first in narrow, repeatable industrial tasks (088).
  - Domestic versus metered model access changes adaptation rates (083).
  public_action: Retain as research relevance; these bear directly on task-boundary migration, measurement, and
    capability access.
- fit: direct
  surface: Epistemic complementarity model
  items:
  - Adversarial telemetry can manufacture the evidence an autonomous agent uses (090).
  - A soft CPI print with falling real pay supplies a multiple-hypothesis benchmark (090).
  - Agent-security norms are being written by deployers while frontier builders remain outside the coalition (089).
  public_action: Retain only when the item changes a mechanism, benchmark, or observable in the model.
- fit: adjacent
  surface: Cross-domain structural bridges
  items:
  - Diplomatic pauses, court channels, and climate-finance cases often share form with delegation or complementarity
    problems.
  public_action: Move to the private bridge ledger; do not present analogy alone as manuscript relevance.
- fit: speculative
  surface: Vocabulary-only mappings
  items:
  - Claims that an unrelated event supports a paper because both can be described as a three-body configuration,
    coupling failure, or polymathy.
  public_action: Omit unless a construct, mechanism, boundary condition, or design variable is changed.
- fit: none
  surface: Operational and confidential work
  items:
  - Routine editorial workload, manuscript handling, and ordinary market or diplomatic updates with no research
    surface.
  public_action: Keep out of the public artifact; operational priorities belong in the private morning briefing.
production_quality:
  strengths:
  - Complete eight-lens structure
  - Improved official-primary sourcing share
  - Cross-year factual projection eliminated after Briefing 040
  - Briefing 090 demonstrates a materially more compact, well-sourced form
  defects:
  - Duplicate/missing canonical numbers
  - Schema drift
  - O/R/H namespace collision
  - Declining links per item
  - No explicit chain refutation fields
  - High anomaly silent-death share
recommendations:
- area: tooling
  problem: Canonical numbering is not a unique key.
  evidence: 91 dated artifacts cover nominal 001–090; 050, 055, and 062 are duplicated, while 056 and 057 are missing.
  intervention: Make the ISO date the primary archive key and require future canonical numbers to be unique and
    monotonic.
  tradeoff: Historical URLs and displayed numbers remain irregular and must be preserved.
  test: Briefings 091–180 produce zero duplicate or missing new numbers; validator fails before publish on a new
    collision.
- area: writing/design
  problem: Coverage grew while reading burden stayed excessive.
  evidence: Mean lens items rose 25.17 → 29.13; mean analytic words remain 11,617 in Cycle 3. Briefing 090 delivered
    26 items, 31 external links, and three deep dives in 6,245 words.
  intervention: 'Use the Briefing 090 architecture as the default: target 6,000–9,000 analytic words, 24–28 lens
    items, and 2–4 deep dives.'
  tradeoff: Less space for exhaustive thread restatement.
  test: At least 75% of the next quarter lands in range without section or source failures.
- area: sources
  problem: Source density fell as topic density rose.
  evidence: Mean external links fell 28.50 → 21.97 while lens items rose; links per lens item fell 1.132 → 0.754.
    Scholarly-domain share fell 3.6% → 2.1%, while official-primary share improved.
  intervention: Require at least one directly supporting source per lens item and a primary/scholarly source for
    every load-bearing scientific, regulatory, or macro claim when available.
  tradeoff: Slower production and occasional omission of weakly sourced but interesting items.
  test: Quarter 2 links per lens item ≥1.0; official+scholarly domain share ≥15%; no Wikipedia domain in the top
    15.
- area: analytical method
  problem: Orienting fields became too easy to satisfy.
  evidence: Cycle 3 has 147 O, 8 H, 0 R reads and 0/155 explicit CONFIRMS/REFUTES fields.
  intervention: Require CONFIRMS, REFUTES, and at most three discriminating release paths with observable tells.
  tradeoff: Chains become more compact and less rhetorically exhaustive.
  test: 100% of Briefings 091–120 chains pass fields; the next audit can identify genuine failures without outcome-derived
    relabeling.
- area: anomalies
  problem: Negative-space tracking is still mostly rhetorical.
  evidence: 'Cycle 3 ledger: 9 resolved, 17 persistent, 98 silently died, and 31 open.'
  intervention: Give every anomaly a stable ID, next observable, and fair review date; require explicit carry-forward
    or closure.
  tradeoff: Recurring absences consume daily space.
  test: Silent-death share falls below 25% in Cycle 4 and every closure links to a later issue.
- area: concept governance
  problem: The vocabulary contains both dead and over-broad concepts.
  evidence: Emergent Concealment appears in one of 91 documents; Governance Vacuum appears in 29 of 31 Cycle 3 artifacts;
    Commons Enclosure appears in 82 of 91.
  intervention: Retire Emergent Concealment from new use; place Sabbath Visibility on watch; require institution
    + missing capacity + consequence for Governance Vacuum; require a literal access gate for Commons Enclosure.
  tradeoff: Historical continuity becomes more explicit and some familiar shorthand disappears.
  test: No retired-concept invocation; every Vacuum/Enclosure use passes its discriminant; no concept appears in
    >80% of quarter documents without review.
- area: research fit
  problem: Analogy has sometimes been promoted as direct research relevance.
  evidence: The corpus frequently maps geopolitical, climate, and legal cases into active research streams even
    when no construct, mechanism, boundary, or design decision changes.
  intervention: Apply Direct/Adjacent/Speculative/None before publishing; only Direct survives in public Research
    Program Relevance.
  tradeoff: Fewer cross-domain bridges appear publicly.
  test: Every public research bridge names the exact construct/mechanism/design variable changed; quarterly audit
    finds zero adjacent-as-direct cases.
- area: geography
  problem: The portfolio remains corridor-heavy.
  evidence: North America leads all cycles; Cycle 3 MENA=224 and Europe=213, while South/Southeast Asia=46 and Sub-Saharan
    Africa=79. Latin America improves 11 → 17 → 45.
  intervention: Use a rolling seven-issue coverage debt, not a daily quota, for South/Southeast Asia and Sub-Saharan
    Africa; keep an explicit Unknown bucket.
  tradeoff: Some days will add a lower-salience item to correct a persistent blind spot.
  test: Each under-covered region appears substantively in at least five of every seven issues and Unknown assignments
    decline 20%.
- area: schema
  problem: Historical markup drift obstructs deterministic audit.
  evidence: Inference wrappers span .chain-block, .inf, and .chain; Briefing 080 embeds vocabulary inside the anomaly
    section; six files reuse O/R/H for epistemic status.
  intervention: Freeze one semantic schema (section/article, data IDs, READ and OBS/INF/HYP namespaces) and validate
    it prospectively from Briefing 091.
  tradeoff: Older files remain heterogeneous and require compatibility parsing.
  test: All new files parse with one selector; no namespace or section-boundary compatibility branch is triggered.
