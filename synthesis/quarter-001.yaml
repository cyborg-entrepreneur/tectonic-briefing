  method: Complete ledger. Manual resolution for nine internally traceable threads; otherwise later-card recurrence
    via transparent token/thread matching; recent items remain open.
  ledger:
  - anomaly_id: 061-20260620-an-1
    briefing: 61
    date: '2026-06-20'
    title: A Strait Was Declared Shut the Same Hour Its Traffic Was Reported Up
    text: 'ANOMALY Closed and Busier at Once A Strait Was Declared Shut the Same Hour Its Traffic Was Reported Up
      The day''s thread reads a declaration outrunning a deed; the strait itself is the sharpest instance and its
      own anomaly. Iran''s command said the Strait of Hormuz was closed; U.S. Central Command said commercial traffic
      actually rose; the vice president had just called it open. The same strait was closed, open, and busier in
      one morning. Held as the day''s central contradiction: a closure that coexists with rising traffic is not
      a fact about the water but a claim about it, and the conspicuous thing is that all three statements were allowed
      to stand at once — a measure of how useful the disagreement is to every party that does not yet want to act
      on a single agreed fact.'
    disposition: resolved
    evidence: Later briefings showed the declaration resolving into signal, differentiated passage, and eventually
      a toll-route negotiation rather than literal closure.
    later_briefing: see evidence; verified within Cycle 3
  - anomaly_id: 061-20260620-an-2
    briefing: 61
    date: '2026-06-20'
    title: A Deal's Envoys Worked Its Terms in Switzerland While Its Terms Were Broken in Lebanon
    text: 'ANOMALY Negotiated and Bombed Together A Deal''s Envoys Worked Its Terms in Switzerland While Its Terms
      Were Broken in Lebanon A briefing about instruments that settle unevenly contains a deal being negotiated
      and violated on the same day. Witkoff and Kushner worked the technical elements in Switzerland and Washington
      scheduled talks for 23 and 25 June, while Israeli strikes killed dozens in southern Lebanon overnight. The
      envoys negotiated the clause the bombs were breaking. Held because it disciplines the thread: negotiation
      and violation are not sequential stages here but simultaneous processes, and the deal''s survival depends
      on which one outruns the other — a contest the day stages without resolving.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 061-20260620-an-3
    briefing: 61
    date: '2026-06-20'
    title: A Million Robots Scaled the Same Month Two Models Were Pulled
    text: 'ANOMALY The Layer No One Fenced A Million Robots Scaled the Same Month Two Models Were Pulled The week''s
      governance instrument reached the model layer and missed the larger one. Amazon''s fleet crossed a million
      robots in June while a single directive disabled Fable 5 and Mythos 5 worldwide. The machine that lifts scaled
      past a million ungoverned; the machine that writes was recalled by one order. Held because it disciplines
      the thread: the most consequential AI for labor is the least legible to governance, and the conspicuous fact
      is that attention and control concentrated on the layer that is easiest to name rather than the layer whose
      effect is largest — exactly backwards from where the displacement lands.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 061-20260620-an-4
    briefing: 61
    date: '2026-06-20'
    title: A Pool Repainted to Reflect Turned Green Within Days
    text: 'ANOMALY A Mirror That Bloomed A Pool Repainted to Reflect Turned Green Within Days The week''s instruments
      mostly settle on contested human timetables; the reflecting pool settled on biology''s. Days after a multimillion-dollar
      "American flag blue" renovation for the country''s 250th, an algae bloom overtook the Lincoln Memorial Reflecting
      Pool, the dark paint and dormant supply-line algae executing a clause the renovation could not suppress. The
      pool was finished to reflect; it bloomed instead. Held as the small counter-instance the thread cannot dramatize:
      here a declaration of a finished, photogenic surface was outrun not by a contested adversary but by ordinary
      chemistry, a reminder that the gap between an asserted state and a real one opens as readily from nature as
      from politics.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 062-20260622-an-1
    briefing: 62
    date: '2026-06-22'
    title: Oil Priced a Strait Closure and a Non-Closure in the Same Session
    text: 'ANOMALY Up at Nine, Back by Four Oil Priced a Strait Closure and a Non-Closure in the Same Session The
      day''s thread reads the deed overtaking the word; the oil tape is the sharpest instance and its own anomaly.
      Crude opened above $78 on Iran''s closure claim and gave the gain back by the close as the talks progressed.
      The market priced a shut strait at the open and an open one by the afternoon. Held as the day''s central reading:
      an intraday round-trip on an unchanged physical fact — the strait was effectively open the whole time — is
      the cleanest signature available of a declaration that failed to bind, and a warning that a state which sees
      its word discounted may reach for the deed that would make the next one stick.'
    disposition: resolved
    evidence: The apparent contradiction became a durable two-lane/tolled-passage regime; later issues supplied
      the missing operating mechanism.
    later_briefing: see evidence; verified within Cycle 3
  - anomaly_id: 062-20260622-an-2
    briefing: 62
    date: '2026-06-22'
    title: Crimea's Pumps Ran Dry With No Declaration Attached
    text: 'ANOMALY A Closure No One Announced Crimea''s Pumps Ran Dry With No Declaration Attached A briefing about
      declarations being overtaken by deeds contains a closure that skipped the declaration entirely. Ukrainian
      strikes burned the fuel supply and Crimea suspended civilian gasoline sales, with no blockade ever proclaimed.
      The chokepoint shut because the depots burned, not because anyone said so. Held because it disciplines the
      thread: not every closure is a word awaiting a deed — some are pure deed, irreversible and unannounced, and
      the conspicuous fact is that the most consequential closure of the day was the one with no statement attached
      at all.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 062-20260622-an-3
    briefing: 62
    date: '2026-06-22'
    title: A "Jailbreaking" Concern Produced a Worldwide Model Shutdown
    text: 'ANOMALY A Cause Too Small for Its Effect A "Jailbreaking" Concern Produced a Worldwide Model Shutdown
      The week''s governance instrument bound far wider than its stated cause. The directive''s rationale was a
      "jailbreaking" risk scoped to foreign nationals, but because the firm could not screen by nationality, the
      narrow cause executed as a global recall of two models. A specific reason produced a total consequence. Held
      because it disciplines the thread: a declared cause and its actual effect can be wildly mismatched at the
      moment of implementation, and the conspicuous fact is that the most consequential AI-governance act of the
      month rests on a rationale far smaller than the shutdown it required.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 062-20260622-an-4
    briefing: 62
    date: '2026-06-22'
    title: A Conservationist Died of a Strike That Landed a Fortnight Earlier
    text: 'ANOMALY A Death on a Two-Week Delay A Conservationist Died of a Strike That Landed a Fortnight Earlier
      The week''s deeds mostly settled fast; one settled on a long delay. Mona Khalil, the Lebanese sea-turtle conservationist,
      died on 21 June of wounds from an Israeli airstrike that had hit her home two weeks before, while the ceasefire
      was being declared renewed. The deed was done a fortnight ago; its full cost arrived this weekend. Held as
      the counter-instance the thread''s market language cannot dramatize: a kinetic deed can complete on a human
      delay, indifferent to the words exchanged in the interval, and the gap between the strike and the death is
      the cruelest version of the week''s gap between deed and word.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 062-20260623-an-1
    briefing: 62
    date: '2026-06-23'
    title: The Inspection Both Sides Cite and Neither Confirms
    text: 'ANOMALY The Test That Isn''t Booked The Inspection Both Sides Cite and Neither Confirms The day''s thread
      reads de-escalation by sheathed instrument; the conspicuous gap is the missing instrument of verification.
      Vance said IAEA inspectors would come "this week"; Iran''s foreign ministry said no visit is scheduled. The
      mechanism that would turn the calm into a fact is the one thing the two sides cannot agree is happening. Held
      as a discipline on the thread: a road map whose confirmation step is disputed at the level of whether it exists
      is calm built on the absence of the very check that would make it durable, and the conspicuous fact is that
      the most load-bearing instrument in the de-escalation is the one no one will schedule.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 062-20260623-an-2
    briefing: 62
    date: '2026-06-23'
    title: H5N1 Spreads to Two New Corners While Human Cases Stay Flat
    text: 'ANOMALY The Quiet Human Ledger H5N1 Spreads to Two New Corners While Human Cases Stay Flat A pathogen
      scientists call "completely out of control" reached Australia and the Antarctic seal colonies this month,
      yet the CDC reported on 5 June no unusual human influenza activity. The ecological footprint is exploding
      while the human signal stays blank. Held because the gap is the whole watch: an outbreak this geographically
      aggressive with no matching human signal is either the welcome absence of the jump or the silence before it,
      and the conspicuous fact is that the thinnest surveillance — the new corners the virus just reached — is exactly
      where the first human signal would be missed.'
    disposition: silently_died
    evidence: No later anomaly card re-acknowledged the absence before the cutoff. This is an attention-tracking
      disposition, not proof that the real-world issue ended.
    later_briefing: null
  - anomaly_id: 062-20260623-an-3
    briefing: 62
    date: '2026-06-23'
    title: The Senate Constrains a War It Cannot Stop
    text: 'ANOMALY A Resolution With No Repeal The Senate Constrains a War It Cannot Stop The day''s de-escalations
      were issuer''s choices; one was not. The Senate passed 50–48 a resolution directing Trump to pull US forces
      from Iran hostilities absent congressional authorization — a constraint it is unlikely to be able to enforce.
      The body asserted a power it may not be able to use. Held because it disciplines the thread: not every sheathed
      instrument is sheathed by choice — some are lowered by the limits of their own enforceability, and the conspicuous
      fact is that the loudest institutional constraint of the week is the one least able to bind the actor it names.'
