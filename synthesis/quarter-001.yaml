    date: '2026-07-27'
    title: The Reason the Bombing Stopped Was Reported on Sunday and Absent From Monday's Framing
    text: ANOMALY An Operational Explanation Published and Not Used The Reason the Bombing Stopped Was Reported
      on Sunday and Absent From Monday's Framing Axios reported on 26 July that CENTCOM's commander had recommended
      halting the Hormuz campaign because it had reached the limit of its effectiveness with roughly a fifth of
      designated targets unstruck, and that the Joint Chiefs chairman had privately warned about interceptor stocks.
      This is a complete, sourced, operational account of why a war paused, published a day before the markets and
      the coverage settled on a diplomatic account of the same event. Both accounts were available; the coverage
      overwhelmingly chose the one with quotes in it. Held because this is not an information-scarcity failure,
      which is the usual form. It is a selection failure with the alternative sitting in plain view. Either the
      operational account was judged less newsworthy because it lacks a named intention, or the narrative frame
      for "war pauses" is strong enough that a supply-side explanation cannot occupy it. The conspicuous fact is
      that the better-sourced explanation lost to the more familiar one inside twenty-four hours.
    disposition: silently_died
