    title: Congo's Ebola Toll Passed 1,400 and the Surveillance System Cannot Agree With Itself
    text: ANOMALY Two Official Counts, One Epidemic, Five Hundred Deaths Apart Congo's Ebola Toll Passed 1,400 and
      the Surveillance System Cannot Agree With Itself The ECDC page updated 27 July records 3,200 confirmed cases
      and 1,405 deaths as of 25 July; the WHO's own Disease Outbreak News for the same event, published 17 July,
      carries 2,124 cases and 828 deaths as of 15 July. Briefing 082 declined to publish a figure on exactly this
      ground and held the item for the Serendipity Queue. The divergence has not narrowed; it has widened. Held
      because a reporting lag alone does not obviously account for a gap of roughly a thousand cases in ten days
      on an outbreak this size, and because the fastest-growing Ebola outbreak on record ought to be the case where
      reconciliation is fastest rather than slowest. Either the DRC's own harmonization process is producing large
      retrospective additions that WHO's publication cadence cannot absorb, or the two systems are counting different
      things. The conspicuous fact is that every downstream allocation decision is being made against whichever
      number the decider opened, and no reporting names which one it used.
