    date: '2026-08-09'
    title: Two Underwriters, Same Audited Numbers, Nearly Three-to-One Apart
    text: ANOMALY 3 Two Underwriters, Same Audited Numbers, Nearly Three-to-One Apart CITIC Securities projects
      Unitree trading below its IPO price within a year; CCB International projects it 80% above. Both firms have
      access to the same financials, the same shipment data, the same margin figures. A spread this wide on a profitable,
      revenue-generating company two days before its shares even open says the uncertainty is about what multiple
      a category deserves, not about whether the business is real.
    disposition: open_not_yet_due
