  - anomaly_id: 089-20260811-an-5
    briefing: 89
    date: '2026-08-11'
    title: 'A Nationwide Degradation Drill With Exactly One Exemption: The Market'
    text: 'ANOMALY 5 A Nationwide Degradation Drill With Exactly One Exemption: The Market Taiwan throttled mobile
      data for millions on Monday and will cover roughly 16 million people across two windows — while the stock
      exchange received an exemption. A rehearsal for infrastructure loss under attack that shields the price-formation
      mechanism has made a striking claim about wartime priorities: communications can degrade, prices must not.
      If the exemption reflects a considered judgment that market panic propagates faster than civilian distress,
      it is defensible; if it reflects which constituency could veto its own inclusion, it is diagnostic. The drill''s
      designers have not said which.'
