  - anomaly_id: 088-20260809-an-5
    briefing: 88
    date: '2026-08-09'
    title: A Peace Process Freed Prisoners and Lost Its Monitor in the Same Week
    text: ANOMALY 5 A Peace Process Freed Prisoners and Lost Its Monitor in the Same Week DR Congo's Doha process
      delivered its first prisoner transfer under last year's deal — a genuine implementation milestone — while
      M23 expelled a Congolese official from the same process's joint ceasefire-verification mechanism. A peace
      process can generate a positive headline and degrade its own oversight capacity simultaneously, and reporting
      that captures only the milestone will miss which provisions are actually strengthening and which are quietly
      emptying out.
    disposition: open_not_yet_due
