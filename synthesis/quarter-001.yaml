  - anomaly_id: 088-20260809-an-4
    briefing: 88
    date: '2026-08-09'
    title: Gold and Equities Both Sat Near Records on the Same Friday
    text: 'ANOMALY 4 Gold and Equities Both Sat Near Records on the Same Friday The textbook relationship — gold
      up when investors seek safety from risk, equities up when they embrace it — did not hold. Both rallied on
      the same jobs report, for compatible but distinct reasons: cheaper future money helps stock valuations and
      lowers gold''s opportunity cost simultaneously. The correlation breakdown is not a mystery; it is a reminder
      that "risk-on" and "risk-off" describe a spectrum, not a switch, and this week both assets sat at the same
      end of it.'
    disposition: open_not_yet_due
    evidence: Fewer than fifteen days have elapsed; no fair observation window has closed.
    later_briefing: null
