      have continued through both institutional responses without visible interruption. Either neither mechanism
      carries any operational leverage over an active siege regardless of how formally it is invoked, or the RSF
      has specifically calculated that international designation processes move too slowly to function as real-time
      deterrence. The conspicuous fact is that two separate institutions, in two separate weeks, both explicitly
      named the atrocity risk in advance and neither prevented anything.
