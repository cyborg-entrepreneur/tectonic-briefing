  - anomaly_id: 089-20260811-an-2
    briefing: 89
    date: '2026-08-11'
    title: Gold Rallied on Rate Cuts Friday and Rate Hikes Tuesday
    text: 'ANOMALY 2 Gold Rallied on Rate Cuts Friday and Rate Hikes Tuesday The same asset rose on opposite monetary
      premises four days apart: Friday''s rally rode cut odds after the jobs miss; Tuesday''s open above $4,400
      rode hike expectations from surging oil. A hedge that pays off under both branches of the Fed''s dispute is
      not mispriced — it is pricing the dispute itself. The anomaly is what it implies about every other asset:
      if gold is rallying on the width of the distribution, positions priced off either mode alone are the ones
      carrying unexamined risk.'
    disposition: open_not_yet_due
    evidence: Fewer than fifteen days have elapsed; no fair observation window has closed.
