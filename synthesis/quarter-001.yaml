themes:
- name: Enclosure and governance lag
  evidence: Commons Enclosure appears in 82 of 91 artifacts; Governance Vacuum rises from a marginal Cycle 1 presence
    to 29 of 31 Cycle 3 artifacts.
  evolution: The frame moved from discrete chokepoints toward AI, minerals, data, and institutional capacity, but
    Governance Vacuum became too general to discriminate.
  counter_reading: The prevalence may partly measure the vocabulary supplied to the writer rather than independent
    recurrence in the world.
- name: Instruments that stop tracking their referents
  evidence: Markets/macro is the largest multi-label theme (1,897 assignments); labor/demography rises 116 → 165
    → 225 across cycles, while Cycle 3 repeatedly juxtaposes improving gauges with deteriorating substrates.
  evolution: 'The treatment sharpened from market-price anomalies into measurement design: occupation levels versus
    entry rates, unemployment versus participation, and policy declarations versus operations.'
  counter_reading: The contradiction format can over-select striking divergences and under-report cases in which
    instruments work normally.
- name: Physical constraints return beneath digital abundance
  evidence: Infrastructure/cyber assignments rise 457 → 492 → 597; environmental lens items rise 67 → 78 → 130;
    robotics rises 77 → 90 → 106.
  evolution: AI coverage increasingly moves downstream into electricity, minerals, telemetry, industrial deployment,
    labor, and regulation rather than model launches alone.
  counter_reading: Keyword co-classification inflates overlaps, so the direction is stronger evidence than the absolute
    assignment count.
- name: Institutional form persists after work-doing power departs
  evidence: Institutions/governance remains among the largest themes (1,497 assignments), while anomaly cards repeatedly
    track votes, courts, inspection regimes, and declarations that fail to alter operations.
  evolution: The corpus progressed from naming hollowing to separating disclosure, operational, enforcement, and
    coordination channels.
  counter_reading: Repeated use of Hollowing and Coupling Failure can redescribe weak implementation without identifying
    a distinct causal mechanism.
- name: Orientation under flux becomes an object of study
  evidence: The archive contains 420 canonical audited chains across three cycles. Cycle 3 labels all 146 prospective
    chains O and yields zero explicit CONFIRMS/REFUTES fields.
  evolution: Cycle 1 classified break mechanisms, Cycle 2 introduced read mode, and Cycle 3 exposed metric adaptation
    and release-field saturation.
  counter_reading: 'This is partly endogenous: the briefing''s own protocol created the pattern it later analyzed.'
