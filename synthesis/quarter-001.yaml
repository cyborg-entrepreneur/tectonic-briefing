    title: 360,000 Evacuations in Two Member States Did Not Produce a Visible Union-Level Response
    text: ANOMALY A Third of a Million Displaced Inside the EU 360,000 Evacuations in Two Member States Did Not
      Produce a Visible Union-Level Response More than 360,000 people had been evacuated from wildfires in France
      and Spain by 26 July, with crews from Greece, Italy, and Portugal deployed alongside 2,737 Spanish personnel,
      and forecasts pointing to rising temperatures and no rain this week. Mutual aid is functioning. What is absent,
      based on the search evidence available for this briefing, is any Union-level political event proportionate
      to the number — no emergency council, no announced financing instrument, no leader-level statement that reached
      general coverage. Held because two readings compete. Either the Civil Protection Mechanism is working exactly
      as designed and a political layer is genuinely unnecessary, which would be a rare instance of an institution
      operating at the correct level. Or a displacement event of this size is being absorbed as seasonal because
      it now recurs annually, which is the baseline-drift failure this briefing has been watching for. The conspicuous
      fact is that the Tour de France's shortened stage received more sustained international coverage than the
      reallocation of state capacity that caused it.
