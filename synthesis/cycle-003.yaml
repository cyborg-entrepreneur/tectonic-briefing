    title: A Strait Was Declared Shut the Same Hour Its Traffic Was Reported Up
    text: 'ANOMALY Closed and Busier at Once A Strait Was Declared Shut the Same Hour Its Traffic Was Reported Up
      The day''s thread reads a declaration outrunning a deed; the strait itself is the sharpest instance and its
      own anomaly. Iran''s command said the Strait of Hormuz was closed; U.S. Central Command said commercial traffic
      actually rose; the vice president had just called it open. The same strait was closed, open, and busier in
      one morning. Held as the day''s central contradiction: a closure that coexists with rising traffic is not
      a fact about the water but a claim about it, and the conspicuous thing is that all three statements were allowed
      to stand at once — a measure of how useful the disagreement is to every party that does not yet want to act
      on a single agreed fact.'
    disposition: resolved
    evidence: Later briefings showed the declaration resolving into signal, differentiated passage, and eventually
      a toll-route negotiation rather than literal closure.
